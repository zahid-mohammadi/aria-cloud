# Axolotl QLoRA config for the Dari/Pashto assistant + site-builder model.
# Run: accelerate launch -m axolotl.cli.train config.yml
# See docs/dari-pashto-finetuning.md for the plan this executes.

base_model: Qwen/Qwen2.5-7B-Instruct
chat_template: qwen

# --- data -----------------------------------------------------------------
datasets:
  - path: data/train.jsonl
    type: chat_template

# --- QLoRA ------------------------------------------------------------------
load_in_4bit: true
adapter: qlora
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# --- training -------------------------------------------------------------
sequence_len: 2048
micro_batch_size: 2
gradient_accumulation_steps: 4
num_epochs: 3
learning_rate: 2.0e-4
lr_scheduler: cosine
warmup_ratio: 0.03
weight_decay: 0.0
bf16: true
gradient_checkpointing: true
logging_steps: 5
save_steps: 100
eval_steps: 100
val_set_size: 0.05

# --- output ---------------------------------------------------------------
output_dir: ./out/aria-qwen-7b-af
